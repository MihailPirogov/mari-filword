plugins { id 'com.android.application' }

// Release signing: own key of «Мари филворд», release/keys/keystore.properties (NOT in git: storeFile, storePassword, keyAlias, keyPassword)
def ksFile = new File('/workspace/mari-filword/release/keys/keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'ru.pirogovlab.marifilword'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'ru.pirogovlab.marifilword'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (ks['storeFile']) {
                storeFile new File('/workspace/mari-filword/release/keys/' + ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        // ad unit IDs: res/values/ads.xml. ads_demo=true -> Yandex demo units (debug builds, or -PadsDemo=true)
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            resValue 'bool', 'ads_demo', (project.findProperty('adsDemo') ?: 'false').toString()
        }
        debug {
            resValue 'bool', 'ads_demo', 'true'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    androidResources { noCompress += ['mp3', 'webp'] }
}

dependencies {
    // Yandex Mobile Ads SDK (banner / interstitial / rewarded). Ad unit IDs: res/values/ads.xml
    implementation 'com.yandex.android:mobileads:8.6.0'
}

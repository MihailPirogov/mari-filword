<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:transparent}
.wood{position:absolute;inset:0;background:repeating-linear-gradient(92deg,rgba(0,0,0,.05) 0 3px,transparent 3px 22px),repeating-linear-gradient(88deg,rgba(255,255,255,.05) 0 2px,transparent 2px 37px),linear-gradient(160deg,#c98a4b,#8f5527 70%,#6b3c18)}
body.fg .wood,body.fg .vig{display:none}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(40,20,5,.55)}
.g{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));width:720px;height:720px;display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.c{background:#f6eedc;border-radius:42px;box-shadow:0 12px 0 #5a3416,inset 0 -8px 0 rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font:900 168px/1 "Roboto Condensed","Arial Narrow",sans-serif;color:#3a2614}
.c.on{background:#d8463a;color:#fff;box-shadow:0 12px 0 #7e1f17,inset 0 -8px 0 rgba(0,0,0,.12)}
svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));width:720px;height:720px;pointer-events:none}
</style></head><body class="">
<div class="wood"></div><div class="vig"></div>
<div class="g">
 <div class="c on">М</div><div class="c on">А</div><div class="c">Ш</div>
 <div class="c">Й</div><div class="c on">Р</div><div class="c">К</div>
 <div class="c">Е</div><div class="c on">И</div><div class="c">О</div>
</div>
<svg viewBox="0 0 720 720"><path d="M110 110 H360 V610" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/></svg>
<script>const q=new URLSearchParams(location.search);if(q.get('fg'))document.body.className='fg';document.documentElement.style.setProperty('--s',q.get('s')||'1')</script>
</body></html>
